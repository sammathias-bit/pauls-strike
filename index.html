/* ---------------- utils ---------------- */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
function angLerp(a,b,t){let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return a+d*t;}
function angTo(a,b){let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;}
function mulberry32(seed){let a=seed>>>0;return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function P(wx,wy){return{x:wx-wy,y:(wx+wy)*0.5};}
function screenDirToWorld(sx,sy){
  const wx=sy+sx*0.5,wy=sy-sx*0.5,l=Math.hypot(wx,wy)||1;
  return{x:wx/l,y:wy/l};
}
function worldAngToScreen(a){const c=Math.cos(a),s=Math.sin(a);return Math.atan2((c+s)*0.5,c-s);}

const SAVE_KEY='pauls-strike-save-v2', SET_KEY='pauls-strike-settings-v2';
function loadJSON(k){try{const s=localStorage.getItem(k);return s?JSON.parse(s):null;}catch(e){return null;}}

/* ---------------- audio — modeled on the Genesis original ---------------- */
const AU={ctx:null,master:null,sfxGain:null,musGain:null,rotorAmp:null,whine:null,whineOsc:null,
  theme:null,step:0,nextT:0,timer:null,muted:!settings.sound};
function unlockAudio(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return;}
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
    AU.ctx=new C();
    AU.master=AU.ctx.createGain(); AU.master.gain.value=AU.muted?0:0.9; AU.master.connect(AU.ctx.destination);
    AU.sfxGain=AU.ctx.createGain(); AU.sfxGain.gain.value=0.85; AU.sfxGain.connect(AU.master);
    AU.musGain=AU.ctx.createGain(); AU.musGain.gain.value=0.26; AU.musGain.connect(AU.master);
    const len=AU.ctx.sampleRate;
    const buf=AU.ctx.createBuffer(1,len,AU.ctx.sampleRate);
    const d=buf.getChannelData(0); let v=0;
    for(let i=0;i<len;i++){v=v*0.965+(Math.random()*2-1)*0.3;d[i]=v;}
    const src=AU.ctx.createBufferSource(); src.buffer=buf; src.loop=true;
    const lp=AU.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=260;
    const amp=AU.ctx.createGain(); amp.gain.value=0;
    const lfo=AU.ctx.createOscillator(); lfo.type='square'; lfo.frequency.value=11.5;
    const lfoG=AU.ctx.createGain(); lfoG.gain.value=0.55;
    lfo.connect(lfoG); lfoG.connect(amp.gain);
    src.connect(lp); lp.connect(amp); amp.connect(AU.master);
    src.start(); lfo.start();
    const wh=AU.ctx.createOscillator(); wh.type='sawtooth'; wh.frequency.value=590;
    const whF=AU.ctx.createBiquadFilter(); whF.type='bandpass'; whF.frequency.value=900; whF.Q.value=2;
    const whG=AU.ctx.createGain(); whG.gain.value=0;
    wh.connect(whF); whF.connect(whG); whG.connect(AU.master); wh.start();
    AU.rotorAmp=amp; AU.whine=whG; AU.whineOsc=wh;
    AU.timer=setInterval(musicTick,25);
  }catch(e){}
}
addEventListener('pointerdown',unlockAudio);
function setMuted(m){AU.muted=m; settings.sound=!m; saveSettings(); if(AU.master)AU.master.gain.value=m?0:0.9;}
function rotorOn(on,intensity){
  if(!AU.rotorAmp)return;
  const t=AU.ctx.currentTime;
  AU.rotorAmp.gain.setTargetAtTime(on?0.42+0.14*(intensity||0):0,t,0.2);
  AU.whine.gain.setTargetAtTime(on?0.035:0,t,0.25);
  if(AU.whineOsc)AU.whineOsc.frequency.setTargetAtTime(560+240*(intensity||0),t,0.3);
}
function tone(freq,dur,type,vol,when,slideTo){
  if(!AU.ctx)return; const t=when||AU.ctx.currentTime;
  const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(AU.sfxGain); o.start(t); o.stop(t+dur+0.02);
}
function noiseBurst(dur,vol,hp,lpStart,lpEnd,when){
  if(!AU.ctx)return; const t=when||AU.ctx.currentTime;
  const n=Math.floor(AU.ctx.sampleRate*dur);
  const buf=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=AU.ctx.createBufferSource(); s.buffer=buf;
  const f=AU.ctx.createBiquadFilter();
  if(hp){f.type='highpass';f.frequency.value=hp;}
  else{f.type='lowpass';f.frequency.setValueAtTime(lpStart||900,t);f.frequency.exponentialRampToValueAtTime(Math.max(40,lpEnd||100),t+dur);}
  const g=AU.ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(g);g.connect(AU.sfxGain); s.start(t); s.stop(t+dur+0.02);
}
const SFX={

  hellfire(){noiseBurst(0.5,0.38,0,1100,90);tone(140,0.45,'sawtooth',0.12,0,50);},
  boom(){tone(160,0.35,'sine',0.5,0,32);noiseBurst(0.45,0.45,0,900,70);},
  bigBoom(){tone(120,0.7,'sine',0.6,0,24);noiseBurst(0.95,0.55,0,750,45);
    if(AU.ctx)tone(60,0.9,'sine',0.35,AU.ctx.currentTime+0.08,20);},
  hit(){tone(220,0.06,'square',0.14,0,90);noiseBurst(0.06,0.16,0,700,200);},
  clank(){tone(320,0.05,'square',0.18,0,140);},
  pickup(){tone(523,0.06,'square',0.16);tone(784,0.09,'square',0.16,AU.ctx?AU.ctx.currentTime+0.07:0);},

  radio(){tone(1200,0.03,'square',0.08);},

function sfx(name){if(AU.ctx&&!AU.muted)try{SFX[name]();}catch(e){}}
const THEMES={
  title:{bpm:126,drums:true,
    bass:[40,40,47,40,40,43,40,45,40,40,47,40,43,41,40,38],
    lead:[64,0,62,64,67,0,64,0,62,0,60,62,64,0,0,0]},
  menu:{bpm:104,drums:false,
    bass:[40,0,0,0,43,0,0,0,45,0,0,0,43,0,41,0],
    lead:[0,0,64,0,0,0,0,0,0,0,62,0,0,0,0,0]},
  brief:{bpm:96,drums:false,
    bass:[40,0,0,0,0,0,46,0,40,0,0,0,45,0,0,0],
    lead:[]},
  win:{bpm:112,drums:true,
    bass:[45,0,45,0,48,0,45,0,43,0,43,0,47,0,43,0],
    lead:[69,0,0,67,69,0,72,0,67,0,0,0,64,0,67,0]}
};
function midi(n){return 440*Math.pow(2,(n-69)/12);}
function setTheme(name){AU.theme=name; AU.step=0; if(AU.ctx)AU.nextT=AU.ctx.currentTime+0.1;}
function schedNote(freq,t,dur,type,vol,detune){
  const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();
  o.type=type; o.frequency.value=freq; if(detune)o.detune.value=detune;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(AU.musGain);o.start(t);o.stop(t+dur+0.02);
}
function schedKick(t){const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();o.type='sine';
  o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(36,t+0.09);
  g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.14);
  o.connect(g);g.connect(AU.musGain);o.start(t);o.stop(t+0.16);}
function schedNoiseM(t,dur,hp,vol){
  const n=Math.floor(AU.ctx.sampleRate*dur),buf=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=AU.ctx.createBufferSource();s.buffer=buf;
  const f=AU.ctx.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
  const g=AU.ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(g);g.connect(AU.musGain);s.start(t);s.stop(t+dur+0.02);}
function musicTick(){
  if(!AU.ctx||!AU.theme||AU.muted)return;
  const th=THEMES[AU.theme]; if(!th)return;
  const stepDur=60/th.bpm/4;
  while(AU.nextT<AU.ctx.currentTime+0.12){
    const i=AU.step%16,t=AU.nextT;
    const b=th.bass[i]; if(b){schedNote(midi(b),t,stepDur*1.5,'square',0.13);schedNote(midi(b),t,stepDur*1.5,'sawtooth',0.05,8);}
    const l=th.lead&&th.lead[i]; if(l&&(Math.floor(AU.step/16)%2===1)){schedNote(midi(l),t,stepDur*1.3,'sawtooth',0.06);schedNote(midi(l),t,stepDur*1.3,'sawtooth',0.03,10);}
    if(th.drums){
      if(i%4===0)schedKick(t);
      if(i===4||i===12)schedNoiseM(t,0.09,1500,0.15);
      if(i%2===0)schedNoiseM(t,0.03,6000,0.05);
    }
    AU.step++; AU.nextT+=stepDur;
  }
}

/* ---------------- input ---------------- */
const keys={}; let pressed=new Set();
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab','Slash'].includes(e.code))e.preventDefault();
  if(!e.repeat){pressed.add(e.code);}
  keys[e.code]=true; unlockAudio();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
let gpPrev=[];
const input={mx:0,my:0,gx:0,gy:0,fire:false,winch:false,cycle:false,pause:false,
  up:false,down:false,left:false,right:false,confirm:false,back:false,w1:false,w2:false,w3:false};
function pollInput(){
  const jp=c=>pressed.has(c);
  let ax0=0,ay0=0,gbtn=[],gjp=[];
  try{
    const pads=navigator.getGamepads?navigator.getGamepads():[];
    let gp=null; for(const p of pads){if(p&&p.connected){gp=p;break;}}
    if(gp){
      ax0=Math.abs(gp.axes[0])>0.22?gp.axes[0]:0;
      ay0=Math.abs(gp.axes[1])>0.22?gp.axes[1]:0;
      gbtn=gp.buttons.map(b=>b.pressed);
      gjp=gbtn.map((b,i)=>b&&!gpPrev[i]);
      gpPrev=gbtn.slice();
      if(gbtn.some(Boolean)||ax0||ay0)unlockAudio();
    } else gpPrev=[];
  }catch(e){}
  const kx=(keys.KeyD?1:0)-(keys.KeyA?1:0);
  const ky=(keys.KeyS?1:0)-(keys.KeyW?1:0);
  const arx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);
  const ary=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);
  if(settings.coop){
    input.mx=clamp(kx,-1,1); input.my=clamp(ky,-1,1);
    input.gx=clamp(arx+ax0,-1,1); input.gy=clamp(ary+ay0,-1,1);
    input.fire=!!(keys.ControlRight||keys.Slash||keys.Space||gbtn[0]||gbtn[7]);
    input.cycle=jp('ShiftRight')||jp('Period')||jp('KeyQ')||jp('Tab')||gjp[2]||gjp[5];
  }else{
    input.mx=clamp(kx+arx+ax0,-1,1); input.my=clamp(ky+ary+ay0,-1,1);
    input.gx=0; input.gy=0;
    input.fire=!!(keys.Space||gbtn[0]||gbtn[7]);
    input.cycle=jp('KeyQ')||jp('Tab')||gjp[2]||gjp[5];
  }
  input.winch=jp('KeyE')||gjp[1]||gjp[6];
  input.pause=jp('KeyP')||jp('Escape')||gjp[9];
  input.up=jp('ArrowUp')||jp('KeyW')||gjp[12]||false;
  input.down=jp('ArrowDown')||jp('KeyS')||gjp[13]||false;
  input.left=jp('ArrowLeft')||jp('KeyA')||gjp[14]||false;
  input.right=jp('ArrowRight')||jp('KeyD')||gjp[15]||false;
  input.confirm=jp('Enter')||jp('Space')||gjp[0]||gjp[9]||false;
  input.back=jp('Escape')||gjp[1]||false;
  input.w1=jp('Digit1'); input.w2=jp('Digit2'); input.w3=jp('Digit3');
  if(jp('KeyC')&&state!=='password'){settings.crt=!settings.crt;saveSettings();applyCrt();}
  if(jp('KeyM')&&state!=='password'){setMuted(!AU.muted);}
}
function endFrameInput(){pressed.clear();}

function makeEnemy(type,x,y,hpMult){
  const base={
    tank:{hp:70,r:20},aa:{hp:55,r:18},sam:{hp:60,r:19},rpg:{hp:16,r:10},radar:{hp:45,r:22},
    heli:{hp:50,r:16},mob:{hp:55,r:20},barracks:{hp:120,r:26},boatp:{hp:60,r:20},
    turret:{hp:150,r:22},core:{hp:850,r:55},boat:{hp:950,r:42},ghost:{hp:1100,r:30}
  }[type];
  return {type,x,y,hx:x,hy:y,hp:base.hp*hpMult,maxhp:base.hp*hpMult,r:base.r,cd:1+Math.random()*2,
    ang:Math.random()*TAU,turAng:0,wx:x,wy:y,burst:0,t:Math.random()*10,dead:false,spawned:0};
}
function buildMission(mi){
  const def=MISSIONS[mi];
  const d=DIFF[G.diff];
  const rng=mulberry32(def.seed);
  const pad={x:440,y:440};
  M={def,mi,camp:def.camp,pad,rng,light:def.light,weather:def.weather,
    time:0,cam:{x:0,y:0},shake:0,deployed:false,
    enemies:[],projectiles:[],pickups:[],pows:[],effects:[],debris:[],craters:[],wrecks:[],bldgs:[],
    trees:[],rocks:[],patches:[],river:null,rain:[],
    radio:{queue:[],cur:null,t:0},
    objectives:def.objectives.map(o=>({id:o[0],need:o[1],done:0})),
    allDone:false,kills:0,rescues:0,shots:0,
    startScore:G.score,startLives:G.lives,
    fuelWarn:0,lowBeep:0,over:false,dying:0,
    gunAng:-Math.PI/2,
    ch:null};
  const jungle=def.camp===1,city=def.camp===2;
  if(jungle){
    const pts=[]; let y=600+rng()*2000;
    for(let x=-100;x<=WORLD+100;x+=150){
      y=clamp(y+(rng()*2-1)*220,300,WORLD-300);
      pts.push({x,y});
    }
    for(const p of pts){if(dist(p.x,p.y,pad.x,pad.y)<420){p.y=pad.y>WORLD/2?p.y-500:p.y+500;}}
    M.river=pts;
  }
  const nTrees=jungle?380:(city?0:55);
  for(let i=0;i<nTrees;i++){
    const x=rng()*WORLD,y=rng()*WORLD;
    if(dist(x,y,pad.x,pad.y)<200)continue;
    if(M.river&&distToRiver(x,y)<90)continue;
    M.trees.push({x,y,r:jungle?13+rng()*15:7+rng()*6,g:rng()});
  }
  for(let i=0;i<(city?20:70);i++){M.rocks.push({x:rng()*WORLD,y:rng()*WORLD,r:4+rng()*8});}
  for(let i=0;i<200;i++){M.patches.push({x:rng()*WORLD,y:rng()*WORLD,w:80+rng()*260,h:50+rng()*160,c:rng()});}
  const placed=[];
  function place(minDist){
    for(let tries=0;tries<200;tries++){
      const x=250+rng()*(WORLD-500),y=250+rng()*(WORLD-500);
      let ok=dist(x,y,pad.x,pad.y)>520;
      if(ok&&M.river&&distToRiver(x,y)<90)ok=false;
      if(ok)for(const p of placed){if(dist(x,y,p.x,p.y)<(minDist||120)){ok=false;break;}}
      if(ok){placed.push({x,y});return{x,y};}
    }
    return {x:250+rng()*(WORLD-500),y:250+rng()*(WORLD-500)};
  }
  const c=def.counts;
  for(const t of['radar','tank','aa','sam','rpg','mob','barracks']){
    for(let i=0;i<(c[t]||0);i++){const p=place(t==='rpg'?90:150);M.enemies.push(makeEnemy(t,p.x,p.y,d.hp));}
  }
  for(let i=0;i<(c.heli||0);i++){const p=place(300);const e=makeEnemy('heli',p.x,p.y,d.hp);e.z=52;M.enemies.push(e);}
  for(let i=0;i<(c.boatp||0);i++){
    const e=makeEnemy('boatp',0,0,d.hp); e.riverT=0.15+rng()*0.7; e.riverDir=rng()<0.5?-1:1;
    const p=riverPos(e.riverT); e.x=p.x; e.y=p.y; M.enemies.push(e);
  }
  for(let i=0;i<c.pow;i++){const p=place(260);M.pows.push({x:p.x,y:p.y,hx:p.x,hy:p.y,state:'wait',t:rng()*10,z:0});}
  const nB=city?42:14;
  for(let i=0;i<nB;i++){
    const p=place(city?120:170);
    M.bldgs.push({x:p.x,y:p.y,w:30+rng()*(city?34:26),d:26+rng()*(city?30:20),h:22+rng()*(city?46:20),hp:40,dead:false,
      kind:city?'block':(rng()<0.28?'tower':'hut'),lit:rng()});
  }
  /* fenced compounds around key sites, with a gate gap */
  M.fences=[];
  const anchors=M.enemies.filter(e=>e.type==='barracks'||e.type==='radar').slice(0,3);
  for(const a of anchors){
    const hw=170+rng()*110,hd=150+rng()*90;
    const corners=[[a.x-hw,a.y-hd],[a.x+hw,a.y-hd],[a.x+hw,a.y+hd],[a.x-hw,a.y+hd]];
    for(let sI=0;sI<4;sI++){
      const c1=corners[sI],c2=corners[(sI+1)%4];
      const len=dist(c1[0],c1[1],c2[0],c2[1]),n=Math.max(3,Math.round(len/46));
      const gate=sI===0?Math.floor(n/2):-99;
      for(let i=0;i<n;i++){
        if(i===gate||i===gate+1)continue;
        M.fences.push({ax:lerp(c1[0],c2[0],i/n),ay:lerp(c1[1],c2[1],i/n),
          bx:lerp(c1[0],c2[0],(i+1)/n),by:lerp(c1[1],c2[1],(i+1)/n)});
      }
    }
  }
  /* dirt roads from the base pad out to the compounds */
  M.roads=[];
  for(const a of anchors.slice(0,2)){
    M.roads.push([{x:pad.x,y:pad.y},
      {x:(pad.x+a.x)/2+(rng()*2-1)*220,y:(pad.y+a.y)/2+(rng()*2-1)*220},
      {x:a.x,y:a.y}]);
  }
  /* landmark props: mesas, oil derricks, crashed aircraft */
  M.props=[];
  if(!city){
    for(let i=0;i<(jungle?0:4);i++){const p=place(220);M.props.push({kind:'derrick',x:p.x,y:p.y,t:rng()*10});}
    for(let i=0;i<5;i++){const p=place(280);M.props.push({kind:'mesa',x:p.x,y:p.y,w:60+rng()*70,d:50+rng()*50,h:24+rng()*20});}
    for(let i=0;i<(jungle?1:2);i++){const p=place(320);M.props.push({kind:'wreck',x:p.x,y:p.y,a:rng()*TAU});}
  }
  M.tex=makeTerrainTex(def.camp,rng);
  if(def.boss==='citadel'){
    const bx=WORLD-750,by=WORLD-750;
    M.boss={kind:'citadel',x:bx,y:by};
    M.enemies.push(makeEnemy('core',bx,by,d.hp));
    for(let i=0;i<4;i++){
      const a=Math.PI/4+i*Math.PI/2;
      M.enemies.push(makeEnemy('turret',bx+Math.cos(a)*110,by+Math.sin(a)*110,d.hp));
    }
  } else if(def.boss==='boat'){
    M.boss={kind:'boat'};
    const b=makeEnemy('boat',0,0,d.hp); b.riverT=0.5; b.riverDir=1;
    const p=riverPos(0.5); b.x=p.x; b.y=p.y;
    M.enemies.push(b);
  } else if(def.boss==='ghost'){
    M.boss={kind:'ghost'};
    const gsp=makeEnemy('ghost',WORLD-700,WORLD-700,d.hp); gsp.z=56;
    M.enemies.push(gsp);
  }
  const amt=d.amt;
  for(let i=0;i<Math.round(6*amt);i++){const p=place(200);M.pickups.push({type:'fuel',x:p.x,y:p.y});}
  for(let i=0;i<Math.round(5*amt);i++){const p=place(200);M.pickups.push({type:'ammo',x:p.x,y:p.y});}
  for(let i=0;i<Math.round(3*amt);i++){const p=place(200);M.pickups.push({type:'armor',x:p.x,y:p.y});}
  M.ch=freshChopper();
  const c0=P(M.ch.x,M.ch.y);
  M.cam.x=c0.x-W/2; M.cam.y=c0.y-H/2;
}

function freshChopper(){
  const cf=chief();
  return {x:M.pad.x,y:M.pad.y,vx:0,vy:0,heading:-Math.PI/2,bank:0,
    armorMax:cf.armor||100,armor:cf.armor||100,fuel:100,aboard:0,
    ammo:{gun:1200+(cf.gunAmmo||0),hydra:60,hellfire:12},weapon:0,cd:0,
    winch:null,rotorT:0,alive:true};
}
function distToRiver(x,y){
  if(!M.river)return 1e9; let best=1e9;
  for(let i=0;i<M.river.length-1;i++){
    const a=M.river[i],b=M.river[i+1];
    const dx=b.x-a.x,dy=b.y-a.y,len2=dx*dx+dy*dy;
    let t=((x-a.x)*dx+(y-a.y)*dy)/len2; t=clamp(t,0,1);
    best=Math.min(best,dist(x,y,a.x+dx*t,a.y+dy*t));
  }
  return best;
}
function riverPos(t){
  const pts=M.river; if(!pts)return{x:0,y:0,ang:0};
  let total=0; const lens=[];
  for(let i=0;i<pts.length-1;i++){const l=dist(pts[i].x,pts[i].y,pts[i+1].x,pts[i+1].y);lens.push(l);total+=l;}
  let dT=clamp(t,0,1)*total;
  for(let i=0;i<lens.length;i++){
    if(dT<=lens[i]){
      const f=dT/lens[i],a=pts[i],b=pts[i+1];
      return{x:lerp(a.x,b.x,f),y:lerp(a.y,b.y,f),ang:Math.atan2(b.y-a.y,b.x-a.x)};
    }
    dT-=lens[i];
  }
  const a=pts[pts.length-2],b=pts[pts.length-1];
  return{x:b.x,y:b.y,ang:Math.atan2(b.y-a.y,b.x-a.x)};
}

const WEAPONS=[
  {name:'GUN',rate:0.115,dmg:6,spd:720,spread:0.05},
  {name:'HYDRA',rate:0.33,dmg:30,spd:540,spread:0.02},
  {name:'HELLFIRE',rate:1.0,dmg:120,spd:430,spread:0}
];
function aimAngle(){return settings.coop?M.gunAng:M.ch.heading;}
function fireWeapon(){
  const ch=M.ch,w=WEAPONS[ch.weapon],key=['gun','hydra','hellfire'][ch.weapon];
  if(ch.cd>0||ch.ammo[key]<=0)return;
  ch.cd=w.rate; ch.ammo[key]--; M.shots++;
  const aim=aimAngle();
  const a=aim+(Math.random()*2-1)*w.spread;
  let dmg=w.dmg;
  if(key==='gun'&&chief().gunDmg)dmg*=chief().gunDmg;
  const p={x:ch.x+Math.cos(aim)*26,y:ch.y+Math.sin(aim)*26,
    vx:Math.cos(a)*w.spd+ch.vx*0.4,vy:Math.sin(a)*w.spd+ch.vy*0.4,
    dmg,from:'player',kind:key,life:key==='gun'?0.9:2.6,target:null,z:56};
  if(key==='hellfire'){
    let best=null,bd=700;
    for(const e of M.enemies){
      if(e.dead)continue;
      const d0=dist(ch.x,ch.y,e.x,e.y);
      if(d0<bd&&Math.abs(angTo(aim,Math.atan2(e.y-ch.y,e.x-ch.x)))<1.3){bd=d0;best=e;}
    }
    p.target=best;
  }
  M.projectiles.push(p);
  M.effects.push({x:ch.x+Math.cos(aim)*30,y:ch.y+Math.sin(aim)*30,z:56,vx:0,vy:0,vz:0,
    life:0.06,max:0.06,size:7,color:'#ffe9a0'});
  sfx(key==='gun'?'gun':(key==='hydra'?'hydra':'hellfire'));
}
function enemyShoot(e,kind){
  const ch=M.ch,d=DIFF[G.diff];
  const a=Math.atan2(ch.y-e.y,ch.x-e.x);
  if(kind==='shell'){
    M.projectiles.push({x:e.x,y:e.y,vx:Math.cos(a)*240,vy:Math.sin(a)*240,dmg:12*d.dmg,from:'enemy',kind:'shell',life:3,z:20});

    const sp=460,a2=a+(Math.random()*2-1)*0.08;

  } else if(kind==='missile'){
    M.projectiles.push({x:e.x,y:e.y,vx:Math.cos(a)*180,vy:Math.sin(a)*180,dmg:20*d.dmg,from:'enemy',kind:'missile',life:5,homing:true,z:e.z||40});

function addScore(n){

function killEnemy(e){
  e.dead=true; M.kills++; G.totalKills++;
  const scores={tank:250,aa:150,sam:200,rpg:100,radar:300,heli:350,mob:300,barracks:350,boatp:250,
    turret:400,core:2500,boat:3000,ghost:4000};
  addScore(scores[e.type]||100);
  const big=e.type==='core'||e.type==='boat'||e.type==='turret'||e.type==='ghost'||e.type==='barracks';
  explosion(e.x,e.y,big,e.z||10);
  M.craters.push({x:e.x,y:e.y,r:e.r*1.2});
  if(e.type!=='rpg'&&e.type!=='heli'&&e.type!=='ghost')M.wrecks.push({x:e.x,y:e.y,r:e.r,t0:M.time});
  if(e.type==='radar')objCredit('radar');
  if(e.type==='aa')objCredit('aa');
  if(e.type==='tank')objCredit('tank');
  if(e.type==='sam'||e.type==='mob')objCredit('sam');
  if(e.type==='barracks')objCredit('depot');
  if(e.type==='core'){objCredit('bossC');say("The Citadel is burning! Outstanding, son. OUTSTANDING!");}
  if(e.type==='boat'){objCredit('bossB');say("She's going down! The Leviathan is sinking! That's my boy!");}
  if(e.type==='ghost'){objCredit('bossG');say("GHOST WING IS DOWN! The sky is yours, Paul! THE SKY IS YOURS!");}
  if(e.type==='turret'){
    const left=M.enemies.filter(x=>x.type==='turret'&&!x.dead).length;
    if(left>0)say("Turret down. "+left+" to go.");
    else say("All turrets destroyed! The core is exposed — hit it with everything!");
  }
}

/* ---------------- chopper ---------------- */
function updateChopper(dt){
  const ch=M.ch,d=DIFF[G.diff],cf=chief();
  if(!ch.alive)return;
  const mag=Math.hypot(input.mx,input.my);
  if(mag>0.05){
    const wd=screenDirToWorld(input.mx,input.my);
    const na=Math.atan2(wd.y,wd.x);
    ch.heading=angLerp(ch.heading,na,clamp(6*dt,0,1));
    ch.vx+=wd.x*560*Math.min(1,mag)*dt;
    ch.vy+=wd.y*560*Math.min(1,mag)*dt;
  }
  const drag=Math.exp(-2.6*dt);
  ch.vx*=drag; ch.vy*=drag;
  const sp=Math.hypot(ch.vx,ch.vy),maxSp=270;
  if(sp>maxSp){ch.vx*=maxSp/sp;ch.vy*=maxSp/sp;}
  ch.x=clamp(ch.x+ch.vx*dt,40,WORLD-40);
  ch.y=clamp(ch.y+ch.vy*dt,40,WORLD-40);
  ch.bank=lerp(ch.bank,clamp(angTo(ch.heading,Math.atan2(ch.vy,ch.vx))*(sp/maxSp),-0.5,0.5),5*dt);
  ch.rotorT+=dt*(22+sp*0.03);
  rotorOn(true,sp/maxSp);
  if(settings.coop){
    const gm=Math.hypot(input.gx,input.gy);
    if(gm>0.15){
      const gd=screenDirToWorld(input.gx,input.gy);
      M.gunAng=Math.atan2(gd.y,gd.x);
    }
  }
  ch.fuel-=d.fuel*dt;
  if(ch.fuel<=25&&M.fuelWarn<1){M.fuelWarn=1;say("Fuel at 25 percent. Find a barrel or get to the pad, NOW.");sfx('warn');}
  if(ch.fuel<=10&&M.fuelWarn<2){M.fuelWarn=2;say("FUEL CRITICAL, PAUL! She'll drop out of the sky!");}
  if(ch.fuel<=10){M.lowBeep-=dt;if(M.lowBeep<=0){M.lowBeep=1.2;sfx('warn');}}
  if(ch.fuel<=0){ch.fuel=0;crashChopper('fuel');return;}
  if(input.cycle){ch.weapon=(ch.weapon+1)%3;sfx('select');}
  if(input.w1)ch.weapon=0; if(input.w2)ch.weapon=1; if(input.w3)ch.weapon=2;
  ch.cd-=dt;
  if(input.fire)fireWeapon();
  const overPad=dist(ch.x,ch.y,M.pad.x,M.pad.y)<75;
  if(overPad&&sp<120){
    const rep=cf.repair||1;
    ch.fuel=Math.min(100,ch.fuel+14*rep*dt);
    ch.armor=Math.min(ch.armorMax,ch.armor+9*rep*dt);
    ch.ammo.gun=Math.min(1200+(cf.gunAmmo||0),ch.ammo.gun+60*dt);
    ch.ammo.hydra=Math.min(60,ch.ammo.hydra+2.2*dt);
    ch.ammo.hellfire=Math.min(12,ch.ammo.hellfire+0.4*dt);
    if(ch.aboard>0){
      M.rescues+=ch.aboard; G.totalRescues+=ch.aboard;
      for(let i=0;i<ch.aboard;i++){objCredit('pow');addScore(500);}
      say(ch.aboard+(ch.aboard>1?" souls":" soul")+" home safe. Their families thank you, Paul.");
      sfx('rescue');
      for(const p of M.pows){if(p.state==='aboard')p.state='rescued';}
      ch.aboard=0;
    }
  }
  const winchTime=1.3*(cf.winch||1),capacity=cf.cap||6;
  if(ch.winch){
    const p=ch.winch;
    if(dist(ch.x,ch.y,p.x,p.y)>70||sp>110){p.state='wait';p.z=0;ch.winch=null;say("Winch line lost! Hold her steady over him, son.");}
    else{
      p.wt+=dt; p.z=clamp(p.wt/winchTime,0,1)*52; sfx('winch');
      if(p.wt>=winchTime){p.state='aboard';ch.winch=null;ch.aboard++;sfx('pickup');
        const names=["He's aboard! ","Got him! ","He's on the line — up we go! "];
        say(names[Math.floor(Math.random()*names.length)]+ch.aboard+" of "+capacity+" aboard.");}
    }
  }
  if(input.winch){
    if(overPad&&M.allDone&&sp<110){missionComplete();return;}
    if(!ch.winch){
      let best=null,bd=55;
      for(const p of M.pows){
        if(p.state!=='wait')continue;
        const d0=dist(ch.x,ch.y,p.x,p.y);
        if(d0<bd){bd=d0;best=p;}
      }
      if(best){
        if(ch.aboard>=capacity)say("Cabin's full, Paul. "+capacity+" is the limit — drop them at the pad first.");
        else if(sp>110)say("Too fast for the winch. Slow down and hover.");
        else{best.state='winching';best.wt=0;best.z=0;ch.winch=best;}
      }
    }
  }
  for(const p of M.pickups){
    if(p.got)continue;
    if(dist(ch.x,ch.y,p.x,p.y)<34){
      p.got=true; sfx('pickup');
      const amt=DIFF[G.diff].amt;
      if(p.type==='fuel'){ch.fuel=Math.min(100,ch.fuel+55);say("Fuel taken aboard. Breathe easy.");}
      if(p.type==='ammo'){ch.ammo.gun=Math.min(1800,ch.ammo.gun+Math.round(350*amt));
        ch.ammo.hydra=Math.min(90,ch.ammo.hydra+Math.round(18*amt));
        ch.ammo.hellfire=Math.min(18,ch.ammo.hellfire+Math.round(4*amt));}
      if(p.type==='armor'){ch.armor=Math.min(ch.armorMax,ch.armor+40);}
    }
  }
  if(ch.armor<=0)crashChopper('shot');
}
function crashChopper(why){
  const ch=M.ch; if(!ch.alive)return;
  ch.alive=false; M.dying=2.2;
  explosion(ch.x,ch.y,true,50);
  rotorOn(false,0);
  if(why==='fuel')say("PAUL! You ran her dry — punching out... please be okay...");
  else say("You're hit! You're hit! Get clear of the wreck!");
}
function loseLife(){
  G.lives--;
  for(const p of M.pows){if(p.state==='aboard'||p.state==='winching'){p.state='wait';p.x=p.hx;p.y=p.hy;p.z=0;}}
  if(G.lives<=0){
    M.over=true; state='gameover'; stTime=0; rotorOn(false,0); setTheme(null);
  } else {
    say("You're alive. Thank God. New bird inbound — get back up there, son. "+G.lives+(G.lives>1?" birds":" bird")+" left.");
    M.ch=freshChopper();
  }
}
function missionComplete(){
  rotorOn(false,0);
  state='debrief'; stTime=0; sfx('confirm'); setTheme('win');
}

/* ---------------- enemies ---------------- */
function updateEnemies(dt){
  const ch=M.ch,d=DIFF[G.diff];
  for(const e of M.enemies){
    if(e.dead)continue;
    e.t+=dt; e.cd-=dt;
    const dp=ch.alive?dist(e.x,e.y,ch.x,ch.y):1e9;
    switch(e.type){
      case 'tank':
        if(dp<380){
          e.turAng=angLerp(e.turAng,Math.atan2(ch.y-e.y,ch.x-e.x),2.5*dt);
          if(e.cd<=0){e.cd=2.3;enemyShoot(e,'shell');}
        } else {
          if(dist(e.x,e.y,e.wx,e.wy)<20){e.wx=clamp(e.x+(Math.random()*2-1)*400,100,WORLD-100);e.wy=clamp(e.y+(Math.random()*2-1)*400,100,WORLD-100);}
          const a=Math.atan2(e.wy-e.y,e.wx-e.x);
          e.ang=angLerp(e.ang,a,1.2*dt);
          e.x+=Math.cos(e.ang)*38*dt; e.y+=Math.sin(e.ang)*38*dt;
          e.turAng=e.ang;
        }
        break;
      case 'aa':
        if(dp<430){
          e.turAng=Math.atan2(ch.y-e.y,ch.x-e.x);
          if(e.cd<=0){e.burst=3;e.cd=2.0;}
          if(e.burst>0&&(e.bcd=(e.bcd||0)-dt)<=0){e.bcd=0.12;e.burst--;enemyShoot(e,'bullet');}
        }
        break;
      case 'sam':
        if(dp<520&&e.cd<=0){e.cd=4.2;enemyShoot(e,'missile');}
        break;
      case 'mob': /* shoot-and-scoot SAM truck */
        if(e.moving){
          const a=Math.atan2(e.wy-e.y,e.wx-e.x);
          e.ang=angLerp(e.ang,a,2*dt);
          e.x+=Math.cos(e.ang)*55*dt; e.y+=Math.sin(e.ang)*55*dt;
          if(dist(e.x,e.y,e.wx,e.wy)<24){e.moving=false;e.cd=1.5;}
        } else if(dp<520&&e.cd<=0){
          e.cd=5; enemyShoot(e,'missile');
          e.moving=true;
          const a=Math.random()*TAU,r=300+Math.random()*250;
          e.wx=clamp(e.x+Math.cos(a)*r,150,WORLD-150);
          e.wy=clamp(e.y+Math.sin(a)*r,150,WORLD-150);
        }
        break;
      case 'rpg':
        if(dp<300&&e.cd<=0){e.cd=3.2;enemyShoot(e,'rocket');}
        e.x+=Math.cos(e.t*0.7)*6*dt; e.y+=Math.sin(e.t*0.9)*6*dt;
        break;
      case 'barracks': /* supply depot: spawns RPG infantry */
        if((e.scd=(e.scd||4)-dt)<=0){
          e.scd=9;
          const alive=M.enemies.filter(x=>x.src===e&&!x.dead).length;
          if(alive<4&&dp<900){
            const a=Math.random()*TAU;
            const s=makeEnemy('rpg',e.x+Math.cos(a)*40,e.y+Math.sin(a)*40,d.hp);
            s.src=e; M.enemies.push(s);
          }
        }
        break;
      case 'radar':
        e.ang+=dt*1.5;
        break;
      case 'heli':{ /* enemy patrol chopper: orbits and strafes */
        if(dp<700){
          const want=Math.atan2(ch.y-e.y,ch.x-e.x);
          const orbit=dp>260?want:want+Math.PI/2;
          e.ang=angLerp(e.ang,orbit,2*dt);
          e.x=clamp(e.x+Math.cos(e.ang)*130*dt,60,WORLD-60);
          e.y=clamp(e.y+Math.sin(e.ang)*130*dt,60,WORLD-60);
          if(dp<420&&e.cd<=0){e.cd=1.8;e.burst=4;}
          if(e.burst>0&&(e.bcd=(e.bcd||0)-dt)<=0){e.bcd=0.1;e.burst--;enemyShoot(e,'bullet');}
        } else {
          e.x+=Math.cos(e.ang)*60*dt; e.y+=Math.sin(e.ang)*60*dt;
          if(e.x<200||e.x>WORLD-200||e.y<200||e.y>WORLD-200)e.ang+=Math.PI/2;
        }
        e.rotorT=(e.rotorT||0)+dt*24;
        break;}
      case 'boatp':{
        e.riverT+=e.riverDir*dt*0.014;
        if(e.riverT>0.95){e.riverT=0.95;e.riverDir=-1;}
        if(e.riverT<0.05){e.riverT=0.05;e.riverDir=1;}
        const p=riverPos(e.riverT);
        e.x=p.x; e.y=p.y; e.ang=p.ang+(e.riverDir<0?Math.PI:0);
        if(dp<400&&e.cd<=0){e.cd=3;enemyShoot(e,'shell');}
        break;}
      case 'turret':
        if(dp<540){
          e.turAng=angLerp(e.turAng,Math.atan2(ch.y-e.y,ch.x-e.x),3*dt);
          if(e.cd<=0){e.cd=1.6;enemyShoot(e,'shell');}
        }
        break;
      case 'core':{
        const turretsLeft=M.enemies.filter(x=>x.type==='turret'&&!x.dead).length;
        if(turretsLeft<=1&&dp<620&&e.cd<=0){
          e.cd=3.0;
          for(let i=0;i<10;i++){
            const a=i/10*TAU+e.t;
            M.projectiles.push({x:e.x,y:e.y,vx:Math.cos(a)*260,vy:Math.sin(a)*260,
              dmg:8*d.dmg,from:'enemy',kind:'bullet',life:2.4,z:30});
          }
          sfx('hydra');
        }
        break;}
      case 'boat':{
        e.riverT+=e.riverDir*dt*0.018;
        if(e.riverT>0.92){e.riverT=0.92;e.riverDir=-1;}
        if(e.riverT<0.08){e.riverT=0.08;e.riverDir=1;}
        const p=riverPos(e.riverT);
        e.x=p.x; e.y=p.y; e.ang=p.ang+(e.riverDir<0?Math.PI:0);
        if(dp<620&&e.cd<=0){e.cd=3.4;enemyShoot(e,'missile');}
        if(dp<420&&(e.fcd=(e.fcd||0)-dt)<=0){
          e.fcd=2.1;
          const base=Math.atan2(ch.y-e.y,ch.x-e.x);
          for(let i=-2;i<=2;i++){
            const a=base+i*0.13;
            M.projectiles.push({x:e.x,y:e.y,vx:Math.cos(a)*430,vy:Math.sin(a)*430,
              dmg:4*d.dmg,from:'enemy',kind:'bullet',life:1.6,z:24});
          }
        }
        break;}
      case 'ghost':{ /* ace gunship: keeps range, strafes, alternates weapons */
        e.rotorT=(e.rotorT||0)+dt*26;
        const want=Math.atan2(ch.y-e.y,ch.x-e.x);
        let move;
        if(dp>430)move=want;
        else if(dp<280)move=want+Math.PI;
        else move=want+(e.strafeDir||(e.strafeDir=Math.random()<0.5?1:-1))*Math.PI/2;
        if((e.swT=(e.swT||0)-dt)<=0){e.swT=2.5+Math.random()*2;e.strafeDir=-((e.strafeDir)||1);}
        e.ang=angLerp(e.ang,move,2.5*dt);
        const spd=dp>500?200:150;
        e.x=clamp(e.x+Math.cos(e.ang)*spd*dt,80,WORLD-80);
        e.y=clamp(e.y+Math.sin(e.ang)*spd*dt,80,WORLD-80);
        if(dp<650&&e.cd<=0){e.cd=4;enemyShoot(e,'missile');}
        if(dp<450&&(e.fcd=(e.fcd||0)-dt)<=0){e.fcd=1.5;e.burst=5;}
        if(e.burst>0&&(e.bcd=(e.bcd||0)-dt)<=0){e.bcd=0.09;e.burst--;enemyShoot(e,'bullet');}
        break;}
    }
  }
}

/* ---------------- projectiles & effects ---------------- */
function updateProjectiles(dt){
  const ch=M.ch;
  for(const p of M.projectiles){
    if(p.deadP)continue;
    p.life-=dt;
    if(p.life<=0){p.deadP=true;continue;}
    if(p.from==='player'&&p.kind==='hellfire'&&p.target&&!p.target.dead){
      const want=Math.atan2(p.target.y-p.y,p.target.x-p.x);
      const cur=Math.atan2(p.vy,p.vx);
      const na=angLerp(cur,want,clamp(3.5*dt,0,1));
      const s=Math.hypot(p.vx,p.vy);
      p.vx=Math.cos(na)*s;p.vy=Math.sin(na)*s;
    }
    if(p.homing&&ch.alive){
      const want=Math.atan2(ch.y-p.y,ch.x-p.x);
      const cur=Math.atan2(p.vy,p.vx);
      const na=angLerp(cur,want,clamp(2.1*dt,0,1));
      const s=Math.min(330,Math.hypot(p.vx,p.vy)+140*dt);
      p.vx=Math.cos(na)*s;p.vy=Math.sin(na)*s;
      p.z=lerp(p.z,52,1.5*dt);
    }
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if((p.kind==='missile'||p.kind==='hellfire'||p.kind==='hydra')&&Math.random()<0.5){
      M.effects.push({x:p.x,y:p.y,z:p.z,vx:0,vy:0,vz:8,life:0.4,max:0.4,size:3,color:'rgba(200,200,200,0.5)',smoke:true});
    }
    if(p.from==='player'){
      let hitSomething=false;
      for(const e of M.enemies){
        if(e.dead)continue;
        if(dist(p.x,p.y,e.x,e.y)<e.r+4){
          e.hp-=p.dmg; p.deadP=true; hitSomething=true;
          M.effects.push({x:p.x,y:p.y,z:e.z||20,vx:0,vy:0,vz:20,life:0.15,max:0.15,size:6,color:'#ffd75e'});
          sfx('hit');
          if(e.hp<=0)killEnemy(e);
          break;
        }
      }
      if(!hitSomething)for(const b of M.bldgs){
        if(b.dead)continue;
        if(dist(p.x,p.y,b.x,b.y)<Math.max(b.w,b.d)){
          b.hp-=p.dmg; p.deadP=true;
          M.effects.push({x:p.x,y:p.y,z:b.h*0.6,vx:0,vy:0,vz:15,life:0.15,max:0.15,size:5,color:'#ccb'});
          sfx('hit');
          if(b.hp<=0){b.dead=true;addScore(50);explosion(b.x,b.y,false,8);M.craters.push({x:b.x,y:b.y,r:b.w});}
          break;
        }
      }
    } else if(ch.alive){
      if(dist(p.x,p.y,ch.x,ch.y)<18){
        ch.armor-=p.dmg; p.deadP=true;
        M.effects.push({x:p.x,y:p.y,z:52,vx:0,vy:0,vz:15,life:0.15,max:0.15,size:6,color:'#ff9c2e'});
        M.shake=Math.min(10,M.shake+3);
        sfx('hit');
      }
    }
  }
  M.projectiles=M.projectiles.filter(p=>!p.deadP);
}
function updateEffects(dt){
  for(const f of M.effects){
    f.life-=dt; f.x+=f.vx*dt; f.y+=f.vy*dt; f.z=(f.z||0)+(f.vz||0)*dt;
    if(f.smoke){f.vx*=0.98;f.vy*=0.98;f.size+=6*dt;}
    else{f.vx*=0.92;f.vy*=0.92;f.vz=(f.vz||0)*0.92;}
  }
  M.effects=M.effects.filter(f=>f.life>0);
  for(const b of M.debris){
    b.life-=dt;
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    b.vz-=520*dt; b.z+=b.vz*dt; b.rot+=b.spin*dt;
    if(b.z<0){b.z=0;b.vz*=-0.4;b.vx*=0.6;b.vy*=0.6;b.spin*=0.5;}
  }
  M.debris=M.debris.filter(b=>b.life>0);
  /* burning wrecks smoke for a while */
  for(const w2 of M.wrecks){
    const age=M.time-w2.t0;
    if(age<16&&Math.random()<0.12){
      M.effects.push({x:w2.x+(Math.random()*2-1)*8,y:w2.y+(Math.random()*2-1)*8,z:8,
        vx:(Math.random()*2-1)*10,vy:(Math.random()*2-1)*10,vz:35,
        life:1.4,max:1.6,size:5+Math.random()*5,color:'rgba(50,50,50,0.5)',smoke:true});
    }
  }
  M.shake=Math.max(0,M.shake-30*dt);
  /* ambient weather */
  if(M.weather==='rain'){
    for(let i=0;i<4;i++)M.rain.push({x:Math.random()*W,y:-10,v:900+Math.random()*300,l:14+Math.random()*10});
    for(const r of M.rain){r.y+=r.v*dt;r.x-=r.v*0.25*dt;}
    M.rain=M.rain.filter(r=>r.y<H+20);
  }
}

/* ---------------- game update ---------------- */
function updateGame(dt){
  M.time+=dt;
  updateRadio(dt);
  if(M.ch.alive){
    updateChopper(dt);
  } else {
    M.dying-=dt;
    rotorOn(false,0);
    if(M.dying<=0&&!M.over){loseLife();}
  }
  updateEnemies(dt);
  updateProjectiles(dt);
  updateEffects(dt);
  const c0=P(M.ch.x,M.ch.y);
  M.cam.x=lerp(M.cam.x,c0.x-W/2,clamp(5*dt,0,1));
  M.cam.y=lerp(M.cam.y,c0.y-H/2,clamp(5*dt,0,1));
  if(input.pause&&M.ch.alive){state='paused';pauseIdx=0;sfx('select');}
}

function pxCanvas(map,pal){
  const h=map.length,w=map[0].length;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const ch=map[y][x]; if(ch==='.')continue;
    g.fillStyle=pal[ch]||'#f0f'; g.fillRect(x,y,1,1);
  }
  return c;
}
function silhouette(src){
  const c=document.createElement('canvas'); c.width=src.width; c.height=src.height;
  const g=c.getContext('2d');
  g.drawImage(src,0,0);
  g.globalCompositeOperation='source-in';
  g.fillStyle='#000'; g.fillRect(0,0,c.width,c.height);
  return c;
}
const SPRITES={};
for(const k of Object.keys(PALS)){
  const body=pxCanvas(APACHE_MAP,PALS[k]);
  SPRITES[k]={body,shadow:silhouette(body)};
}
function drawChopperSprite(x,y,screenAng,bank,rotorT,scale,palKey){

const TERRAIN={

  2:{void:'#101018',ground:'#33343e',border:'#22222c',p1:'rgba(28,28,36,0.35)',p2:'rgba(58,58,70,0.3)',rock:'#4a4a55'}

/* dense speckled ground texture — sand grain, pebbles, scrub tufts */
function makeTerrainTex(camp,rng){
  const S2=320,c=document.createElement('canvas'); c.width=c.height=S2;
  const g=c.getContext('2d');
  g.fillStyle=TERRAIN[camp].ground; g.fillRect(0,0,S2,S2);
  const tones=camp===0?['#c9a562','#dcbc80','#c29e60','#b69254','#e2c68e','#cdaa6c']:
    camp===1?['#28451c','#356024','#1f3a16','#2e5522','#24401a','#316028']:
    ['#34353f','#3f4049','#2c2d36','#44454f','#383944'];
  for(let i=0;i<2600;i++){
    g.fillStyle=tones[(rng()*tones.length)|0];
    const s=1+rng()*2.4;
    g.fillRect(rng()*S2,rng()*S2,s,s);
  }
  /* pebble clusters (grey-purple stones) */
  for(let i=0;i<(camp===2?12:26);i++){
    const cx=rng()*S2,cy=rng()*S2,n=3+rng()*5;
    for(let j=0;j<n;j++){
      const px=cx+(rng()*2-1)*9,py=cy+(rng()*2-1)*7,r=1+rng()*2.2;
      g.fillStyle=camp===0?(rng()<0.5?'#8d7f95':'#7d7268'):(camp===1?'#5a6a55':'#565764');
      g.beginPath(); g.arc(px,py,r,0,TAU); g.fill();
      g.fillStyle='rgba(0,0,0,0.3)'; g.fillRect(px-r,py+r*0.5,r*2,1);
    }
  }
  /* scrub tufts / surface cracks */
  for(let i=0;i<(camp===2?46:120);i++){
    const x=rng()*S2,y=rng()*S2;
    g.strokeStyle=camp===0?'#6d7a3a':(camp===1?'#4d7a2e':'#23242c');
    g.lineWidth=1; g.beginPath();
    g.moveTo(x,y); g.lineTo(x-2,y-3);
    g.moveTo(x,y); g.lineTo(x+1,y-4);
    g.moveTo(x,y); g.lineTo(x+3,y-2);
    g.stroke();
  }
  /* faint vehicle tracks */
  for(let i=0;i<4;i++){
    const y0=rng()*S2,x0=rng()*S2;
    g.strokeStyle='rgba(90,70,40,0.18)'; g.lineWidth=2.5;
    g.beginPath(); g.moveTo(x0,y0);
    g.bezierCurveTo(x0+60,y0+20*(rng()-0.5),x0+140,y0+40*(rng()-0.5),x0+240,y0+30*(rng()-0.5));
    g.stroke();
  }
  /* dune ridges — wavy darker crests with a light lip */
  if(camp===0)for(let i=0;i<7;i++){
    const y0=rng()*S2,x0=rng()*S2,ln=90+rng()*140;
    g.strokeStyle='rgba(150,116,62,0.5)'; g.lineWidth=3;
    g.beginPath(); g.moveTo(x0,y0);
    g.bezierCurveTo(x0+ln*0.3,y0-14-rng()*10,x0+ln*0.7,y0+14+rng()*10,x0+ln,y0);
    g.stroke();
    g.strokeStyle='rgba(238,214,150,0.55)'; g.lineWidth=1.5;
    g.beginPath(); g.moveTo(x0,y0-2);
    g.bezierCurveTo(x0+ln*0.3,y0-16-rng()*10,x0+ln*0.7,y0+12+rng()*10,x0+ln,y0-2);
    g.stroke();
  }
  return c;
}
/* striped quad — wooden plank walls & roofs */
function plankFace(p1,p2,p3,p4,base,line,n){
  ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y);
  ctx.lineTo(p3.x,p3.y); ctx.lineTo(p4.x,p4.y); ctx.closePath();
  ctx.fillStyle=base; ctx.fill();
  ctx.strokeStyle=line; ctx.lineWidth=1;
  for(let i=1;i<n;i++){
    const t=i/n;
    ctx.beginPath();
    ctx.moveTo(lerp(p1.x,p2.x,t),lerp(p1.y,p2.y,t));
    ctx.lineTo(lerp(p4.x,p3.x,t),lerp(p4.y,p3.y,t));
    ctx.stroke();
  }
  ctx.strokeStyle='rgba(20,12,4,0.6)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y);
  ctx.lineTo(p3.x,p3.y); ctx.lineTo(p4.x,p4.y); ctx.closePath(); ctx.stroke();
}
function isoCorners(camX,camY,wx,wy,hw,hd){
  return [P(wx-hw,wy-hd),P(wx+hw,wy-hd),P(wx+hw,wy+hd),P(wx-hw,wy+hd)]
    .map(p=>({x:p.x-camX,y:p.y-camY}));
}
function raise(pts,h){return pts.map(p=>({x:p.x,y:p.y-h}));}
function drawWoodHut(camX,camY,b){
  const hw=b.w*0.55,hd=b.d*0.55,h=b.h*0.5,rh=10;
  const c=isoCorners(camX,camY,b.x,b.y,hw,hd);

  plankFace(c[1],c[2],t[2],t[1],'#8a6a3c','#6a4e28',5);
  plankFace(c[3],c[2],t[2],t[3],'#a88450','#82603a',6);

  const dm={x:lerp(c[3].x,c[2].x,0.5),y:lerp(c[3].y,c[2].y,0.5)};

  const r2={x:(t[1].x+t[2].x)/2,y:(t[1].y+t[2].y)/2-rh};
  plankFace(t[3],t[2],r2,r1,'#c8a05c','#9a7840',7);

function drawWatchtower(camX,camY,b){
  const hw=b.w*0.34,hd=b.d*0.34,lh=44,ph=12;

function drawAtmosphere(){

    ctx.fillStyle='rgba(205,165,90,0.16)'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(225,190,120,0.25)'; ctx.lineWidth=1.5;

      const yy=((i*137+M.time*260)%(H+80))-40;

function wrapText(str,x,y,maxW,lh){
  const words=str.split(' '); let line='',yy=y;
  for(const w2 of words){
    const test=line?line+' '+w2:w2;
    if(ctx.measureText(test).width>maxW){ctx.fillText(line,x,yy);line=w2;yy+=lh;}
    else line=test;
  }
  ctx.fillText(line,x,yy);
  return yy+lh;
}

    textShadow(W/2,H-70,'FOR PAUL & DAD',20,'#e8dfa8','center');
    textShadow(W/2,H-44,'and every mission they flew together',12,'#d9c99a','center');
    ctx.globalAlpha=1;
  }
  if(stTime>6)textShadow(W/2,H-22,'PRESS ENTER FOR TITLE',11,'#aaa','center');
  if(input.confirm&&stTime>2){state='title';stTime=0;sfx('confirm');}
}
function drawGameOver(){
  drawGame();
  const {x,y}=centerPanel(520,280);
  textShadow(W/2,y+30,'GAME OVER',36,'#ff5050','center');
  textShadow(W/2,y+90,'"We\'ll get \'em next time, son.',14,'#7fd77f','center');
  textShadow(W/2,y+110,'Your old man is still proud of you." — THE COLONEL',14,'#7fd77f','center');
  textShadow(W/2,y+160,'SCORE: '+fmt(G.score),16,'#fff','center');
  const pw=PASSWORDS[G.diff][G.mi];
  if(pw)textShadow(W/2,y+186,'THIS MISSION\'S PASSWORD: '+pw,12,'#7fd77f','center');
  textShadow(W/2,y+230,'PRESS ENTER FOR TITLE',13,Math.sin(stTime*3.5)>-0.2?'#aaa':'#555','center');
  if(input.confirm&&stTime>1){state='title';stTime=0;sfx('confirm');}
}
const PAUSE_ITEMS=['RESUME','RESTART MISSION','QUIT TO TITLE'];
function drawPaused(){
  drawGame();
  const {x,y}=centerPanel(400,PAUSE_ITEMS.length*44+90);
  textShadow(W/2,y+20,'PAUSED',26,'#ffd75e','center');
  PAUSE_ITEMS.forEach((it,i)=>{
    const sel=i===pauseIdx;
    textShadow(W/2,y+70+i*44,(sel?'▸ ':'')+it,17,sel?'#ffd75e':'#ccc','center');
  });
  if(input.up){pauseIdx=(pauseIdx+PAUSE_ITEMS.length-1)%PAUSE_ITEMS.length;sfx('select');}
  if(input.down){pauseIdx=(pauseIdx+1)%PAUSE_ITEMS.length;sfx('select');}
  if(input.pause){state='game';sfx('select');return;}
  if(input.confirm){
    sfx('confirm');
    if(pauseIdx===0)state='game';
    else if(pauseIdx===1){G.score=M.startScore;G.lives=M.startLives;buildMission(G.mi);deployMission();state='game';}
    else{rotorOn(false,0);setTheme('menu');state='title';stTime=0;}
  }
}

/* ---------------- main loop ---------------- */
let last=performance.now(),lastTick=performance.now(),gDt=0.016;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; gDt=dt;
  if(settings.pixel){ctx=octx;PS=0.5;}else{ctx=mctx;PS=1;}
  setT(1,0,0,1,0,0);
  pollInput();
  stTime+=dt;
  switch(state){
    case 'title': drawTitle(); break;
    case 'menu': drawMenu(); break;
    case 'password': drawPassword(); break;
    case 'controls': drawControls(); break;
    case 'chief': drawChiefSelect(); break;
    case 'crew': drawCrew(); break;
    case 'briefing': drawBriefing(); break;
    case 'campintro': drawCampIntro(); break;
    case 'game': updateGame(dt); drawGame(); break;
    case 'paused': drawPaused(); break;
    case 'debrief': drawDebrief(); break;
    case 'victory': drawVictory(); break;
    case 'gameover': drawGameOver(); break;
  }
  endFrameInput();
  if(settings.pixel){
    mctx.setTransform(1,0,0,1,0,0);
    mctx.imageSmoothingEnabled=false;
    mctx.drawImage(off,0,0,W/2,H/2,0,0,W,H);
  }
}
function tick(){lastTick=performance.now();try{frame(lastTick);}catch(e){console.error(e);}}
(function raf(){tick();requestAnimationFrame(raf);})();
/* watchdog: keep the game running even if requestAnimationFrame is throttled */
setInterval(()=>{if(performance.now()-lastTick>60)tick();},33);
</script>
